  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile    
    container_name: rag-ingestion
    command: python src/workers/ingestion.py
    depends_on:
      #- kafka
      - qdrant
    env_file:
      - ./.env
    volumes:
      - type: bind
        source: ./staging #points to rag-architecture/staging
        target: /app/staging
      - type: bind
        source: ./database #points to rag-architecture/database
        target: /app/database
      
