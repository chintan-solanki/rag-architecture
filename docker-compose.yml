services:

  kafka:
    image: apache/kafka:4.0.0
    container_name: rag-kafka

    ports:
      - "9092:9092"

    environment:
      # Kafka runs as both broker and controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Internal Docker listener + external host listener.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka_data:/var/lib/kafka/data

  # producer:
  #   build: .
  #   container_name: rag-producer
  #   command: python ingestion/workers/producer.py
  #   depends_on:
  #     - kafka


  consumer:
    build: .
    container_name: rag-consumer
    command: python ingestion/workers/consumer.py
    depends_on:
      - kafka

  filewatcher:
    build: .
    container_name: filewatcher
    command: python ingestion/workers/filewatcher.py
    depends_on:
      - kafka
    volumes:
      - type: bind
        source: ./staging #points to rag-architecture/staging
        target: /app/staging
    
volumes:
  kafka_data:
  