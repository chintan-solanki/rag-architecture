services:

  kafka:
    image: apache/kafka:4.0.0
    container_name: rag-kafka

    ports:
      - "9092:9092"

    environment:
      # Kafka runs as both broker and controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Internal Docker listener + external host listener.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka_data:/var/lib/kafka/data
    
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s  

  
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant/storage:/qdrant/storage

  #create required collections if not aready exists
  qdrant-init:
    build:
      context: ./qdrant
      dockerfile: dockerfile
    
    working_dir: /app
    depends_on:
      qdrant:
        condition: service_started

  
  filewatcher:
    build:
      context: .
      dockerfile: ingestion/Dockerfile    
    container_name: rag-filewatcher
    command: python src/workers/filewatcher.py
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./staging #points to rag-architecture/staging
        target: /app/staging

  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile    
    container_name: rag-ingestion
    command: python src/workers/ingestion.py
    depends_on:
      kafka:
        condition: service_healthy
      qdrant-init:
          condition: service_completed_successfully
    env_file:
      - ./.env
    volumes:
      - type: bind
        source: ./staging #points to rag-architecture/staging
        target: /app/staging
      - type: bind
        source: ./database #points to rag-architecture/database/sqlite
        target: /app/database
      
volumes:
  kafka_data:
  