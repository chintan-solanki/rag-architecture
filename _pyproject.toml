[project]
name = "rag_architecture"
version = "0.1.0"
description = "RAG architecture for hybrid search and citation backed responses"
readme = "README.md"
authors = [
    { name = "chintan-solanki", email = "chinsol.8973@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "arxiv>=4.0.1",
    "numpy>=2.5.2",
    "pandas>=2.3,<3",
    "watchdog>=6.0.0",
]


[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

dev = [
    "dotenv>=0.9.9",
    "fastembed>=0.8.0",
    "ipykernel>=7.3.0",
    "llama-index>=0.14.24",
    "llama-index-readers-file>=0.6.0",
    "llama-index-vector-stores-qdrant>=0.10.3",
    "markdown-it-py>=4.2.0",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "qdrant-client>=1.19.0",
]
